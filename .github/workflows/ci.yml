name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile (syntax check)
        run: python -m py_compile run_spanner_benchmark.py verify_results.py

      - name: "Unit tests: Theorem-1 certificate positive/negative controls, greedy self-certification property test, independent Dijkstra cross-check against networkx"
        run: python -m unittest discover -s tests -v

      - name: Pipeline smoke test (offline, synthetic, stratified Iran + international)
        run: python run_spanner_benchmark.py --quick --synthetic

      - name: Smoke tests of the forced-edge-by-hour and region-fault experiments (offline, synthetic)
        run: |
          python benchmarks/forced_by_hour.py --synthetic --cities Yazd --t 2
          python benchmarks/region_fault.py --synthetic --cities Yazd --regions 4 --heldout 6
          python benchmarks/minimality.py --synthetic --cities Yazd --t 2
          python benchmarks/road_exact.py --synthetic --cities Yazd --t 3 --windows 4
          python benchmarks/emergency_response.py --synthetic --cities Yazd --regions 3 --heldout 4
          python benchmarks/more_cities.py --synthetic --registry-only --t 2
          python benchmarks/directedness.py --synthetic --registry-only --t 2
          python benchmarks/lightness.py --synthetic --registry-only --t 2
          python benchmarks/edge_order.py --synthetic --cities Yazd --t 2 --seeds 2
          rm -f results/benchmarks/forced_by_hour*.csv results/benchmarks/forced_by_hour.md results/benchmarks/region_fault.* results/benchmarks/minimality.* results/benchmarks/road_exact* results/benchmarks/emergency_response.* results/benchmarks/more_cities* results/benchmarks/directedness* results/benchmarks/lightness* results/benchmarks/edge_order*

      - name: Independent verification of the smoke-test results
        run: python verify_results.py

      - name: Upload smoke-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results-py${{ matrix.python-version }}
          path: results/
          retention-days: 14
